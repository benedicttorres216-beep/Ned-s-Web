<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glass Calculator</title>

<link rel="stylesheet" href="style.css">

</head>
<body>

<div class="calculator">
<button id="themeToggle" class="theme-btn" onclick="toggleTheme()">
    🌙
</button>

</button>
    <div id="display" class="display">0</div>

    <div class="buttons">

        <button class="clear" onclick="clearDisplay()">AC</button>
        <button class="operator" onclick="append('%')">%</button>
        <button class="operator" onclick="append('/')">÷</button>
        <button class="operator" onclick="append('*')">×</button>

        <button onclick="append('7')">7</button>
        <button onclick="append('8')">8</button>
        <button onclick="append('9')">9</button>
        <button class="operator" onclick="append('-')">−</button>

        <button onclick="append('4')">4</button>
        <button onclick="append('5')">5</button>
        <button onclick="append('6')">6</button>
        <button class="operator" onclick="append('+')">+</button>

        <button onclick="append('1')">1</button>
        <button onclick="append('2')">2</button>
        <button onclick="append('3')">3</button>
        <button class="operator" onclick="calculate()">=</button>

        <button class="zero" onclick="append('0')">0</button>
        <button onclick="append('.')">.</button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
<style>
body{
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#0f1115;
    font-family:Arial,sans-serif;
}

.calculator{
    width:350px;
    padding:22px;
    border-radius:30px;
    background:rgba(30,30,30,.85);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 10px 35px rgba(0,0,0,.5);
}

.display{
    height:95px;
    margin-bottom:18px;
    padding:20px;
    border-radius:20px;
    background:#1b1f27;
    color:#ffffff;
    font-size:48px;
    display:flex;
    justify-content:flex-end;
    align-items:flex-end;
    overflow:hidden;
}

.buttons{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
}

button{
    height:70px;
    border:none;
    border-radius:20px;
    font-size:22px;
    cursor:pointer;
    color:white;
    background:#2b313d;
    transition:.2s;
}

button:hover{
    background:#384150;
}

button:active{
    transform:scale(.95);
}

.operator{
    background:#2962ff;
}

.equal{
    background:#00c853;
}

.clear{
    background:#e53935;
}

.zero{
    grid-column:span 2;
}

/* Light Mode */
body.light{
    background:#f2f2f2;
}

body.light .calculator{
    background:#ffffff;
    border:1px solid #ddd;
}

body.light .display{
    background:#f8f8f8;
    color:#111;
}

body.light button{
    background:#e5e5e5;
    color:#111;
}

body.light .operator{
    background:#4f8cff;
    color:#fff;
}

body.light .equal{
    background:#00c853;
    color:#fff;
}

body.light .clear{
    background:#e53935;
    color:#fff;
}

.theme-btn{
    width:60px;
    height:60px;
    border:none;
    border-radius:50%;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(20px);
    color:#fff;
    font-size:28px;
    cursor:pointer;
    margin-bottom:20px;
    transition:.3s ease;
    box-shadow:0 8px 20px rgba(0,0,0,.35);
}

.theme-btn:hover{
    transform:scale(1.08);
}

.theme-btn:active{
    transform:scale(.92);
}

body.light .theme-btn{
    background:#ffffff;
    color:#111;
}
</style>
<script>
const display = document.getElementById("display");
let expression = "";

// Add number/operator
function append(value) {
    expression += value;
    display.textContent = expression || "0";
}

// Clear display
function clearDisplay() {
    expression = "";
    display.textContent = "0";
}

// Delete last character
function deleteLast() {
    expression = expression.slice(0, -1);
    display.textContent = expression || "0";
}

// Calculate
function calculate() {
    const subscribe = confirm(
        "✨ Calculator Premium\n\n" +
        "Unlock unlimited calculations.\n\n" +
        "Price: ₱999.99/month\n\n" +
        "Subscribe now?"
    );

    if (subscribe) {
        alert("Payment gateway is under maintenance.");
    } else {
        alert("HAHAHA PULUBI.");
    }

    display.textContent = "I MISS YOU BABY";
}

// Dark / Light Mode
function toggleTheme() {
    document.body.classList.toggle("light");

    const btn = document.getElementById("themeToggle");

    if (document.body.classList.contains("light")) {
        btn.textContent = "☀️";
        localStorage.setItem("theme", "light");
    } else {
        btn.textContent = "🌙";
        localStorage.setItem("theme", "dark");
    }
}

// Load saved theme
window.addEventListener("load", () => {
    const savedTheme = localStorage.getItem("theme");

    if (savedTheme === "light") {
        document.body.classList.add("light");
        document.getElementById("themeToggle").textContent = "☀️";
    }
});
</script>
