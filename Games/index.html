
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>YAWA NA NAWONG</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="game"></canvas>

<div class="hud">
<div>SCORE <span id="score">0</span></div>
<div>HP <span id="hp">100</span></div>
<div>LEVEL <span id="level">1</span></div>
</div>

<div id="start" class="screen">
<div class="box">
<div class="rocket">
<svg viewBox="0 0 100 100" width="75" height="75" fill="none">
<path d="M50 8C68 15 82 33 82 57L63 76L37 76L18 57C18 33 32 15 50 8Z" fill="url(#rocketGradient)" stroke="#B8F7FF" stroke-width="2"/>
<path d="M50 8V76" stroke="#DDFBFF" stroke-width="2" opacity=".5"/>
<circle cx="50" cy="43" r="11" fill="#02030A" stroke="#63EDFF" stroke-width="3"/>
<path d="M18 57L7 75L37 76M82 57L93 75L63 76" fill="#735CFF" stroke="#A8F8FF" stroke-width="2"/>
<path d="M40 76L45 94L50 84L55 94L60 76" fill="#FF3C9D"/>
<defs>
<linearGradient id="rocketGradient" x1="50" y1="8" x2="50" y2="76" gradientUnits="userSpaceOnUse">
<stop stop-color="#B8F7FF"/>
<stop offset="1" stop-color="#735CFF"/>
</linearGradient>
</defs>
</svg>
</div>
<h1>pakyunimodol</h1>
<p><b>NAWONGUGYAWA</b></p>
<button id="startButton">START GAME</button>
</div>
</div>

<div id="over" class="screen hidden">
<div class="box">
<h1>GAME OVER</h1>
<p>FINAL SCORE</p>
<h1 id="final">0</h1>
<button id="again">PLAY AGAIN</button>
</div>
</div>

<div class="controls">
<button id="left">◀</button>

<button id="fire">
<svg viewBox="0 0 24 24" width="34" height="34" fill="none">
<path d="M3 11H16L20 14V17H13L11 20H7V17H3V11Z" fill="#FF5CA8" stroke="#FFD6EA" stroke-width="1.5" stroke-linejoin="round"/>
<path d="M16 11V8H21V11" stroke="#FFD6EA" stroke-width="1.5" stroke-linecap="round"/>
<path d="M8 17V13" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
<path d="M5 8V5M3 6H7" stroke="#63EDFF" stroke-width="1.5" stroke-linecap="round"/>
</svg>
</button>

<button id="right">▶</button>
</div>

<script src="script.js"></script>
</body>
</html>
