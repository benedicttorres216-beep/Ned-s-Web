<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DOIT PORTAL</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="background"></div>

<main class="login-card">

    <div class="logo">
        <div class="logo-ring"></div>
    </div>

    <h1>DOIT PORTAL</h1>

    <p class="subtitle">
        Please enter your details to sign in.
    </p>

    <div class="input-container" id="emailContainer">

    <label for="email">Email or Username</label>

    <input
        type="text"
        id="email"
        autocomplete="username"
    >

</div>

<div class="input-container password-container" id="passwordContainer">

    <label for="password">Password</label>

    <input
        type="password"
        id="password"
        autocomplete="current-password"
    >

    <button
        class="arrow-btn"
        id="loginBtn"
        type="button"
    >
        <span class="arrow"></span>
    </button>

</div>

<label class="remember">

    <input type="checkbox" id="remember">

    <span class="custom-checkbox"></span>

    <span>Remember me</span>

</label>

    <div class="divider">
        <span></span>
        <p>OR</p>
        <span></span>
    </div>

    <div class="create-account">

        <span>Don't have an account?</span>

        <a href="#" id="createAccount">
            Create Account
        </a>

    </div>

    <div class="message" id="message"></div>
    
   <button class="social-btn" id="googleBtn" type="button">

    <div class="social-icon google-icon">
        <span>G</span>
    </div>

    <span class="social-text">
        Continue with Google
    </span>

    <span class="social-arrow">
        <span class="arrow"></span>
    </span>

</button>

<button class="social-btn" id="githubBtn" type="button">

    <div class="social-icon github-icon">
        <span>●</span>
    </div>

    <span class="social-text">
        Continue with GitHub
    </span>

    <span class="social-arrow">
        <span class="arrow"></span>
    </span>

</button> 
    

</main>

<script src="script"".js"></script>

</body>
</html>
